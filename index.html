<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wi-Fi Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Wi-Fi Registration Portal</h1>
      <p class="tagline">
        Register to receive your Wi-Fi access. (Demo app for security audit.)
      </p>
    </div>
  </header>

  <main class="container">
    <!-- Registration form -->
    <section class="card">
      <h2>Register for Wi-Fi</h2>
      <form id="wifiForm">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Jane Doe">

        <label for="roomNumber">Room / Office</label>
        <input type="text" id="roomNumber" name="roomNumber" placeholder="204B">

        <label for="wifiPassword">Desired Wi‑Fi password</label>
        <input type="text" id="wifiPassword" name="wifiPassword" placeholder="Password you want to use">

        <label for="reason">Reason for access</label>
        <textarea id="reason" name="reason" placeholder="Explain why you need Wi‑Fi"></textarea>

        <button type="button" id="registerButton">Register</button>
      </form>
      <div id="confirmationBox" class="info-box">
        <!-- JS will print confirmation here (uses innerHTML) -->
      </div>
    </section>

    <!-- Public registrations list (visible to everyone) -->
    <section class="card">
      <h2>Recent Registrations</h2>
      <div id="registrationsList">
        <!-- JS will render a list here -->
      </div>
    </section>

    <!-- Admin section: shown when URL has ?admin=true -->
    <section class="card admin" id="adminSection">
      <h2>Admin Panel</h2>
      <p>
        This panel is visible when the URL contains <code>?admin=true</code>
        (client-side check only, no real login).
      </p>
      <p id="masterPasswordBox"></p>
      <div id="adminTableBox"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Wi-Fi Registration Portal &copy; 2026</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
